[project]
name = "tasteops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maitray-agrawal", email = "maitrayagrawal1705@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
]

[project.scripts]
tasteops-mcp = "tasteops.mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
