name: Backend CI / Test Gates

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Code Quality & Test Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Gate 1 - Ruff Linter
        run: uv run ruff check src tests

      - name: Gate 2 - Ruff Formatter Check
        run: uv run ruff format --check src tests

      - name: Gate 3 - Mypy Static Type Checking
        run: uv run mypy src

      - name: Gate 4 - Pytest Suite
        run: uv run pytest -v

  docker-build:
    name: Docker Build & Health Validation Gate
    runs-on: ubuntu-latest
    needs: backend-quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker container
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: tasteops-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Startup and Liveness
        run: |
          docker run -d --name tasteops-test -p 8000:8000 \
            -e ENVIRONMENT=production \
            -e QLOO_API_KEY=mock_ci_test_key_12345 \
            -e PORT=8000 \
            tasteops-backend:test

          echo "Waiting for container to initialize..."
          sleep 5

          echo "Testing /health endpoint..."
          curl -f --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8000/health

          echo "Verifying /ready endpoint..."
          curl -f --retry 3 --retry-delay 2 --retry-connrefused http://localhost:8000/ready

          docker logs tasteops-test
          docker stop tasteops-test
