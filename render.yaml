# ==============================================================================
# Render Blueprint Specification for TasteOps Backend Web Service
# ==============================================================================
services:
  - type: web
    name: tasteops-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production

      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com

      - key: QLOO_API_KEY
        sync: false

      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,https://<your-frontend-domain>.vercel.app"

      - key: QLOO_TIMEOUT_SECONDS
        value: "15.0"

      - key: QLOO_MAX_RETRIES
        value: "3"

      - key: QLOO_RETRY_BACKOFF_FACTOR
        value: "0.5"

      - key: QLOO_CACHE_ENABLED
        value: "true"

      - key: QLOO_CACHE_TTL_SECONDS
        value: "3600"

      - key: TASTEOPS_STORAGE_DIR
        value: "/app/storage/workflows"

      - key: LOG_LEVEL
        value: "INFO"
